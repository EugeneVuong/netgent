# YouTube direct search-and-play workflow (hand-authored, YAML).
#
# Same schema as the JSON workflows (engine.schema.WorkflowSchema); YAML is
# just a friendlier authoring format. Run with:
#
#   uv run python scripts/replay_yaml_workflow.py \
#       scripts/workflow/youtube_search_play_workflow.yaml \
#       --param query="big buck bunny" --param watch_seconds=20
#
# Runtime values are {{placeholders}} declared under `parameters`.

specification: |
  1. Go to https://www.youtube.com.
  2. Type <secret>query</secret> into the YouTube search box and press Enter.
  3. Wait for the results page to load.
  4. Click the first regular video in the results (not an ad, Short, channel, or playlist).
  5. Keep the video playing for <secret>watch_seconds</secret> seconds.

parameters:
  - query
  - watch_seconds

states:
  - checks:
      - type: always_true
        params: {}
    actions:
      - type: go_to_url
        params:
          url: https://www.youtube.com
          new_tab: false
      - type: input_text
        params:
          selector: input[name="search_query"]
          text: "{{query}}"
      - type: send_keys
        params:
          keys: Enter
      - type: wait
        params:
          seconds: "5"
      # ytd-video-renderer excludes ad cards, Shorts shelves, channels, playlists.
      - type: click_element
        params:
          selector: ytd-video-renderer a#video-title
          timeout_ms: 10000
      - type: wait
        params:
          seconds: "{{watch_seconds}}"
      # Fail the run if the player is paused/ended — "all actions ran" is not
      # the same as "the video played".
      - type: assert_media_playing
        params:
          selector: video
          min_seconds: 5
    end_state: Workflow Completed
