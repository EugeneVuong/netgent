# Google -> YouTube search-and-play workflow (hand-authored, YAML).
#
# Prompt this implements:
#   "In Google, search for youtube, then click on the link, then search
#    something on YouTube, and then play that video."
#
# Run with:
#   uv run python scripts/replay_yaml_workflow.py \
#       scripts/workflow/google_youtube_search_workflow.yaml \
#       --param google_query=youtube --param youtube_query="big buck bunny" \
#       --param watch_seconds=20
#
# Requires BROWSER_CHANNEL=chrome + headful (Google's bot check blocks the
# bundled Chromium and all headless modes) and >=5 min between runs.

specification: |
  1. Go to https://www.google.com.
  2. Type <secret>google_query</secret> into the Google search box and press Enter, then wait for the results page.
  3. Click the first result, which is the youtube.com link.
  4. On YouTube, type <secret>youtube_query</secret> into the search box and press Enter, then wait for the results.
  5. Click the first regular video in the results (not an ad, Short, channel, or playlist).
  6. Keep the video playing for <secret>watch_seconds</secret> seconds.

parameters:
  - google_query
  - youtube_query
  - watch_seconds

states:
  - checks:
      - type: always_true
        params: {}
    actions:
      # --- Google ---
      - type: go_to_url
        params:
          url: https://www.google.com
          new_tab: false
      - type: input_text
        params:
          selector: textarea[name="q"]
          text: "{{google_query}}"
      - type: send_keys
        params:
          keys: Enter
      - type: wait
        params:
          seconds: "5"
      # Google result titles are <h3>s navigated by JS (no ancestor <a href>),
      # so click the first heading inside the results container.
      - type: click_element
        params:
          selector: "#search h3"
          timeout_ms: 10000
      # --- YouTube ---
      # Let YouTube's app hydrate before typing; pressing Enter before the
      # search form's handler is attached leaves the query unsubmitted.
      - type: wait
        params:
          seconds: "3"
      - type: input_text
        params:
          selector: input[name="search_query"]
          text: "{{youtube_query}}"
      - type: send_keys
        params:
          keys: Enter
      - type: wait
        params:
          seconds: "5"
      # ytd-video-renderer excludes ad cards, Shorts shelves, channels, playlists.
      - type: click_element
        params:
          selector: ytd-video-renderer a#video-title
          timeout_ms: 10000
      - type: wait
        params:
          seconds: "{{watch_seconds}}"
    end_state: Workflow Completed
